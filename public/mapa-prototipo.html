<!DOCTYPE html>

<title>Mapa de Condomínios — S.A Imóveis Alphaville (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFEF04;--bg:#0a0a0a;--ink:#f3f3f0;--mute:#9a9a92;--line:#2a2a26;--panel:#121211}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
svg#map{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none;display:block}
svg#map.drag{cursor:grabbing}
.muni{fill:none;stroke:#3b3b35;stroke-width:1.2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.water-r{fill:none;stroke:#1d3a52;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.water-w{fill:#13283a;stroke:#1d3a52;stroke-width:1;vector-effect:non-scaling-stroke}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.road.m{stroke:#4a4a43;stroke-width:3.2}
.road.t{stroke:#45453f;stroke-width:2.6}
.road.p{stroke:#383833;stroke-width:2}
.road.s{stroke:#2c2c28;stroke-width:1.4}
.road.a{stroke:#2c2c28;stroke-width:1.2}
.terr{fill:rgba(255,239,4,.06);stroke:rgba(255,239,4,.55);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .2s}
.terr.com{fill:rgba(120,200,255,.06);stroke:rgba(140,205,255,.55)}
.terr.box{fill:rgba(255,255,255,.025);stroke:rgba(255,255,255,.35);stroke-dasharray:4 4}
.terr:hover,.terr.hl{fill:rgba(255,239,4,.2)}
.terr.com:hover,.terr.com.hl{fill:rgba(140,205,255,.2)}
.terr.dim{opacity:.25}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#b8b8ae;white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 1px 3px #000,0 0 8px #000}
.lbl.road{font-size:10px;color:#77776d;letter-spacing:.08em;text-transform:none;font-style:italic}
.lbl.muni{font-size:13px;color:#56564e;letter-spacing:.35em;font-weight:700}
#layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* ---------- bolhas ---------- */
.bub{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);will-change:transform;touch-action:none;-webkit-tap-highlight-color:transparent}
.bub .float{animation:float var(--dur,6s) ease-in-out infinite;animation-delay:var(--del,0s)}
.bub .sphere{position:relative;width:var(--s);height:var(--s);border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 6%,rgba(255,255,255,.35) 10%,transparent 22%),
    radial-gradient(circle at 70% 78%,rgba(255,255,255,.25),transparent 30%),
    radial-gradient(circle at 50% 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,.18) 70%,rgba(255,255,255,.55) 100%);
  box-shadow:inset 0 0 calc(var(--s)*.18) rgba(255,239,4,.35),0 0 calc(var(--s)*.35) rgba(255,239,4,.18);
  backdrop-filter:blur(1.5px);display:grid;place-items:center;transition:transform .25s}
.bub .sphere::before{content:"";position:absolute;inset:0;border-radius:50%;padding:2px;
  background:conic-gradient(from var(--rot,0deg),#ff9de2,#9fe7ff,#fff3a0,#b6ffcf,#d7b5ff,#ff9de2);
  -webkit-mask:radial-gradient(circle,transparent 60%,#000 72%);mask:radial-gradient(circle,transparent 60%,#000 72%);
  opacity:.55;mix-blend-mode:screen;animation:spin 9s linear infinite}
.bub .sphere::after{content:"";position:absolute;inset:8%;border-radius:50%;
  background:conic-gradient(from 200deg,transparent,rgba(160,230,255,.18),transparent 30%,rgba(255,160,220,.16),transparent 60%,rgba(255,240,150,.18),transparent);
  animation:spin 14s linear infinite reverse}
.bub:hover .sphere{transform:scale(1.08)}
.bub .num{position:relative;z-index:2;text-align:center;line-height:1;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.bub .num b{display:block;font-size:calc(var(--s)*.34)}
.bub .num small{display:block;font-size:max(8px,calc(var(--s)*.12));font-weight:600;letter-spacing:.04em;opacity:.9;margin-top:2px}
.bub .cap{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:3px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;color:var(--ink);background:rgba(10,10,10,.72);padding:2px 7px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .2s}
.bub.capon .cap{opacity:1}
.bub:hover .cap{opacity:1;z-index:3}
.bub.region .sphere{box-shadow:inset 0 0 calc(var(--s)*.2) rgba(255,239,4,.5),0 0 calc(var(--s)*.5) rgba(255,239,4,.25)}
.bub.region .cap{opacity:1;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
.bub.gone{pointer-events:none}
.bub.gone .sphere{animation:pop .38s ease-out forwards}
.bub.regrow .sphere{animation:regrow .6s cubic-bezier(.2,1.6,.4,1)}
.drop{position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,rgba(190,235,255,.7) 50%,rgba(255,255,255,0) 72%);pointer-events:none;animation:drop .55s ease-out forwards}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid rgba(255,255,255,.7);pointer-events:none;transform:translate(-50%,-50%);animation:ring .45s ease-out forwards}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(1);opacity:1}40%{transform:scale(1.28);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@keyframes regrow{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes ring{0%{width:20px;height:20px;opacity:1}100%{width:var(--rs);height:var(--rs);opacity:0}}
/* ---------- topo ---------- */
#top{position:absolute;left:16px;right:16px;top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{background:rgba(10,10,10,.82);border:1px solid var(--line);padding:10px 14px;border-radius:14px;backdrop-filter:blur(8px)}
.brand h1{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em}
.brand h1 span{color:var(--y)}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--mute)}
.seg{display:flex;background:rgba(10,10,10,.82);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px)}
.seg button{all:unset;cursor:pointer;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:#cfcfc6}
.seg button.on{background:var(--y);color:#111}
.search{position:relative}
.search input{background:rgba(10,10,10,.82);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:9px 14px;font:500 13px Inter,sans-serif;width:210px;outline:none;backdrop-filter:blur(8px)}
.search input:focus{border-color:var(--y)}
.sugg{position:absolute;top:110%;left:0;right:0;background:#151514;border:1px solid var(--line);border-radius:12px;max-height:260px;overflow:auto;display:none}
.sugg div{padding:8px 12px;font-size:13px;cursor:pointer}
.sugg div:hover,.sugg div.on{background:#24241f}
.sugg div span{float:right;color:var(--mute);font-size:12px}
#zoom{position:absolute;right:16px;bottom:64px;display:flex;flex-direction:column;gap:6px;z-index:5}
#zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(10,10,10,.85);color:var(--ink);font-size:20px;cursor:pointer}
#zoom button:hover{border-color:var(--y);color:var(--y)}
#foot{position:absolute;left:16px;bottom:14px;right:80px;font-size:11px;color:#77776d;z-index:4;pointer-events:none}
#foot b{color:#a9a99e;font-weight:600}
#legend{position:absolute;left:16px;bottom:40px;display:flex;gap:14px;font-size:11.5px;color:#b5b5ab;z-index:4;background:rgba(10,10,10,.7);padding:7px 12px;border-radius:10px;border:1px solid var(--line)}
#legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
#tip{position:absolute;pointer-events:none;background:#151514;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:12px;display:none;z-index:6;white-space:nowrap}
/* ---------- painel ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:10;display:flex;flex-direction:column}
#panel.open{transform:none}
#panel header{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
#panel .x{position:absolute;right:14px;top:14px;all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#cfcfc6;font-size:20px}
#panel .x:hover{background:#22221e}
#panel .kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);font-weight:700}
#panel h2{margin:4px 0 2px;font-size:22px;font-weight:800;padding-right:40px}
#panel .sub{font-size:12.5px;color:var(--mute)}
#panel .chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#panel .chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;color:#d8d8cf}
#panel .chip b{color:var(--y);margin-right:4px}
#panel .chip.on{background:var(--y);color:#111;border-color:var(--y)}
#panel .chip.on b{color:#111}
#panel .sort{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
#panel .sort select{background:#1a1a18;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:500 12px Inter,sans-serif}
#list{overflow:auto;flex:1;padding:8px 12px 24px}
.card{display:flex;gap:12px;align-items:stretch;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 4px;background:#171715;transition:border-color .15s,transform .15s;animation:cardin .35s both}
.card .th{flex:0 0 92px;height:92px;border-radius:10px;background:#22221e center/cover no-repeat;position:relative;overflow:hidden}
.card .th::after{content:'S.A';position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:#3a3a33;font-size:15px}
.card .th.has::after{display:none}
.card .bd{flex:1;min-width:0}
.card:hover{border-color:var(--y);transform:translateY(-1px)}
.card .r1{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mute)}
.card .tag{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:10.5px;padding:2px 7px;border-radius:6px;background:#26261f;color:#e9e9de}
.card .tag.v{background:rgba(255,239,4,.15);color:var(--y)}
.card .tag.l{background:rgba(140,205,255,.15);color:#a9dcff}
.card .t{font-size:14.5px;font-weight:700;margin:5px 0 1px;text-transform:capitalize}
.card .f{font-size:12.5px;color:#bdbdb3}
.card .p{margin-top:5px;font-size:15.5px;font-weight:800}
.card .p small{font-size:12px;color:var(--mute);font-weight:600;margin-left:6px}
.card .go{font-size:12px;color:var(--y);font-weight:600;margin-top:4px}
@keyframes cardin{from{opacity:0;transform:translateY(8px)}}
#panel .cta{padding:12px 20px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
#hint{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(10,10,10,.85);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:12.5px;color:#d5d5cc;z-index:4;transition:opacity .6s}
@media (max-width:700px){
  #top{left:10px;right:10px;top:10px;gap:8px}
  .brand{padding:7px 11px;border-radius:12px}
  .brand h1{font-size:13.5px}
  .brand p{font-size:10.5px}
  .seg button{padding:6px 10px;font-size:12px}
  .search{flex:1 1 150px}
  .search input{width:100%;padding:10px 14px;font-size:16px}
  #panel{top:auto;height:70%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%)}
  #panel header{padding:14px 16px 10px}
  #panel header::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#3a3a34;margin:-4px auto 10px}
  #panel h2{font-size:19px}
  #panel .x{top:16px;right:10px}
  #legend{display:none}
  #foot{left:10px;right:60px;bottom:8px;font-size:9.5px;line-height:1.3}
  #zoom{right:10px;bottom:46px}
  #zoom button{width:38px;height:38px}
  #hint{bottom:58px;font-size:12px;white-space:nowrap}
  .bub .cap{font-size:10.5px;padding:2px 6px}
  .card .th{flex-basis:84px;height:84px}
}
</style>
</head>

const bubbles=[];
function sizeFor(n,region){return region?Math.min(150,58+Math.sqrt(n)*4.2):Math.min(96,34+Math.sqrt(n)*6.5)}
function makeBubble(obj,region){const b=document.createElement('div');b.className='bub'+(region?' region':'');
  b.innerHTML='<div class="float"><div class="sphere"><div class="num"><b></b><small></small></div></div></div><div class="cap"></div>';
  const fl=b.firstChild;fl.style.setProperty('--dur',(5+Math.random()*3).toFixed(2)+'s');fl.style.setProperty('--del',(-Math.random()*6).toFixed(2)+'s');

  b.addEventListener('click',e=>{e.stopPropagation();region?flyToRegion(obj):popAndOpen(obj,b)});

  layer.appendChild(b);const rec={b,obj,region};bubbles.push(rec);return rec}
condos.filter(c=>c.c&&c.n).forEach(c=>makeBubble(c,false));
// regiões
const regions={};condos.filter(c=>c.c&&c.n).forEach(c=>{const r=regions[c.reg]=regions[c.reg]||{name:c.reg,list:[],n:0,v:0,l:0};r.list.push(c)});
Object.values(regions).forEach(r=>{let w=0,x=0,y=0;r.list.forEach(c=>{w+=c.n;x+=c.c[0]*c.n;y+=c.c[1]*c.n});r.c=[x/w,y/w];
  r.n=r.list.reduce((s,c)=>s+c.n,0);r.v=r.list.reduce((s,c)=>s+c.v,0);r.l=r.list.reduce((s,c)=>s+c.l,0);
  const xs=r.list.map(c=>c.c[0]),ys=r.list.map(c=>c.c[1]);r.bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];makeBubble(r,true)});
function refreshCounts(){bubbles.forEach(({b,obj,region})=>{const n=cnt(obj);b.querySelector('b').textContent=n;
  b.querySelector('small').textContent=n===1?'imóvel':'imóveis';const s=sizeFor(n,region);b.dataset.n=n;b.dataset.base=s});lastZf=-1;applySizes()}
let lastZf=-1;
function applySizes(){const mob=MOB();const zf=Math.round(Math.min(1,Math.max(.55,.5+.1*rz()))*(mob?.72:1)*20)/20;if(zf===lastZf)return;lastZf=zf;
  bubbles.forEach(({b,region})=>{const s=Math.round(+b.dataset.base*(region?(mob?.55:1):zf));b.querySelector('.sphere').style.setProperty('--s',s+'px');b.querySelector('small').style.display=s<46?'none':'';b.dataset.s=s})}
// ---------- vista / zoom ----------
const view={k:1,x:0,y:0};let K0=1;const MOB=()=>innerWidth<=700;let REGION_K=1.9;const rz=()=>view.k/K0;
function W(){return svg.clientWidth}function H(){return svg.clientHeight}
function apply(){world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  REGION_K=MOB()?3.0:1.9;applySizes();const showReg=rz()<REGION_K;const shown=[];
  for(const r of bubbles){const ll=r.obj.c;const p=P(ll[0],ll[1]);const x=p[0]*view.k+view.x,y=p[1]*view.k+view.y;
    const vis=(r.region?showReg:!showReg)&&+r.b.dataset.n>0;
    r.b.style.display=vis?'':'none';if(vis){r.b.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;if(!r.region)shown.push({r,x,y,s:+r.b.dataset.s})}}
  if(showReg){const R=bubbles.filter(r=>r.region&&r.b.style.display!=='none').map(r=>{const p=P(r.obj.c[0],r.obj.c[1]);return {r,x:p[0]*view.k+view.x,y:p[1]*view.k+view.y,s:+r.b.dataset.s}});
    for(let it=0;it<20;it++)for(let i=0;i<R.length;i++)for(let j=i+1;j<R.length;j++){const A=R[i],B=R[j];let dx=B.x-A.x,dy=B.y-A.y;const d=Math.hypot(dx,dy)||1,min=(A.s+B.s)/2+30;if(d<min){const m=(min-d)/2;dx/=d;dy/=d;A.x-=dx*m;A.y-=dy*m;B.x+=dx*m;B.y+=dy*m}}
    R.forEach(o=>o.r.b.style.transform=`translate(${o.x}px,${o.y}px) translate(-50%,-50%)`)}

const app=$('#app');
// nomes sempre visíveis: os maiores primeiro, sem sobrepor outro nome ou bolha
function placeCaptions(shown){const mob=innerWidth<=700;const cw=mob?6.0:6.5;const boxes=shown.map(o=>({x0:o.x-o.s/2,y0:o.y-o.s/2-6,x1:o.x+o.s/2,y1:o.y+o.s/2,own:o.r}));
  const W0=W(),H0=H();

    let ok=rc.x1>0&&rc.x0<W0&&rc.y1>0&&rc.y0<H0;
    if(ok)for(const b of boxes){if(b.own===o.r)continue;if(rc.x0<b.x1&&rc.x1>b.x0&&rc.y0<b.y1&&rc.y1>b.y0){ok=false;break}}
    o.r.b.classList.toggle('capon',ok);if(ok)boxes.push(rc)})}
function fitBounds(b,pad){const a=P(b[0],b[3]),c=P(b[2],b[1]);const w=c[0]-a[0],h=c[1]-a[1];const k=Math.min((W()-pad*2)/w,(H()-pad*2)/h);return {k,x:W()/2-(a[0]+w/2)*k,y:H()/2-(a[1]+h/2)*k}}
let anim=null;
function animateTo(t,ms=700){cancelAnimationFrame(anim);const s={...view},t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/ms);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    const lk=Math.log(s.k)+(Math.log(t.k)-Math.log(s.k))*u;view.k=Math.exp(lk);
    // interpola o centro do mundo para um voo suave
    const sc=[(W()/2-s.x)/s.k,(H()/2-s.y)/s.k],tc=[(W()/2-t.x)/t.k,(H()/2-t.y)/t.k];const cx=sc[0]+(tc[0]-sc[0])*u,cy=sc[1]+(tc[1]-sc[1])*u;
    view.x=W()/2-cx*view.k;view.y=H()/2-cy*view.k;apply();if(u<1)anim=requestAnimationFrame(step)};anim=requestAnimationFrame(step)}
function zoomAt(f,cx,cy,animate){const k=Math.max(K0*.6,Math.min(K0*90,view.k*f));const t={k,x:cx-(cx-view.x)*k/view.k,y:cy-(cy-view.y)*k/view.k};if(animate)animateTo(t,350);else{Object.assign(view,t);apply()}}
const ALL=(()=>{const pts=condos.filter(c=>c.c&&['Alphaville','Tamboré'].includes(c.reg)).map(c=>c.c);return [Math.min(...pts.map(p=>p[0]))-.004,Math.min(...pts.map(p=>p[1]))-.004,Math.max(...pts.map(p=>p[0]))+.004,Math.max(...pts.map(p=>p[1]))+.004]})();
function fitAll(animate){const t=fitBounds(ALL,40);K0=t.k;const c=P((ALL[0]+ALL[2])/2,(ALL[1]+ALL[3])/2);t.x=W()/2-c[0]*t.k;t.y=H()/2-c[1]*t.k;animate?animateTo(t):(Object.assign(view,t),apply())}
function flyToRegion(r){const t=fitBounds([r.bb[0]-.003,r.bb[1]-.003,r.bb[2]+.003,r.bb[3]+.003],70);t.k=Math.max(t.k,K0*REGION_K*1.15);if(r.list.length===1)t.k=Math.max(t.k,K0*8);animateTo(t,900)}
function flyTo(c,k){const p=P(c.c[0],c.c[1]);const open=$('#panel').classList.contains('open'),mob=innerWidth<=700;const cx=W()/2+(!mob&&open?-210:0),cy=mob&&open?H()*.17:H()/2;animateTo({k,x:cx-p[0]*k,y:cy-p[1]*k},850)}
// arrastar / pinça / roda
let drag=null,moved=false;const pts=new Map();
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false;cancelAnimationFrame(anim);

  if(drag.pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const k=Math.max(K0*.6,Math.min(K0*90,drag.k*d/drag.pinch));
    view.k=k;view.x=drag.cx-(drag.cx-drag.vx)*k/drag.k;view.y=drag.cy-(drag.cy-drag.vy)*k/drag.k;moved=true;apply()}
  else if(!drag.pinch){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply()}});
